<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlipQuick – Instant Receipt & Quote Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>SlipQuick</h1>
    <p class="subtitle">Create a clean receipt or quote in 10 seconds</p>

    <div class="card">
      <label>Document Type</label>
      <select id="docType">
        <option value="RECEIPT">Receipt (Paid)</option>
        <option value="QUOTE">Quote (Estimate)</option>
      </select>

      <label>Currency</label>
      <select id="currency">
        <option value="R">R (ZAR)</option>
        <option value="$">$ (USD)</option>
        <option value="£">£ (GBP)</option>
        <option value="€">€ (EUR)</option>
      </select>

      <label>Your Business / Seller Name</label>
      <input type="text" id="businessName" placeholder="e.g. Mvelo Kicks" />

      <label>Customer Name</label>
      <input type="text" id="customerName" placeholder="e.g. Thabo" />

      <label>Item / Service Description</label>
      <input type="text" id="itemName" placeholder="e.g. Jordan Spizike Low" />

      <label>Amount</label>
      <input type="number" id="amount" placeholder="e.g. 1500" />

      <button id="generateBtn">Create Slip</button>
    </div>

    <div id="slipPreview" class="slip hidden"></div>
    <button id="copyBtn" class="secondary-btn hidden">Copy for WhatsApp</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
